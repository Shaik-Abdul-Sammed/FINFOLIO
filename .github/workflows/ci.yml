name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "Abdul@9010"
          POSTGRES_DB: finfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend-api/package-lock.json
        
    - name: Install dependencies
      working-directory: ./backend-api
      run: npm ci
      
    - name: Run build
      working-directory: ./backend-api
      run: npm run build
      
    - name: Setup DB and Seed
      working-directory: ./backend-api
      env:
        DATABASE_URL: postgres://postgres:Abdul@9010@localhost:5432/finfolio
      run: |
        npm run setup-db
        npm run seed-db
        
    - name: Run Tests
      working-directory: ./backend-api
      env:
        DATABASE_URL: postgres://postgres:Abdul@9010@localhost:5432/finfolio
      run: npm run test -- --run

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run type check
      working-directory: ./frontend
      run: npx tsc --noEmit
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
